vt:
  task: variable_tracking
  args:
    type_haystack: noise
    num_chains: 1
    num_hops: 4

# difficulty sweep: report the top 3 instead of the top 10. The metric is
# fraction-of-golds, so num_cw=10 is punishing -- this is the knob most likely
# to lift cwe off the floor.
cwe:
  task: common_words_extraction
  args:
    freq_cw: 30
    freq_ucw: 3
    num_cw: 10
    
# difficulty sweep: steeper Zipf so the top-3 stand out more.
fwe:
  task: freq_words_extraction
  args:
    alpha: 2.0

qa_1:
  task: qa
  args:
    dataset: squad

qa_2:
  task: qa
  args:
    dataset: hotpotqa
# --- confusable-key factorial (mk1 structure: essay haystack, 1 value, 1 query) ---
# Key length is held at key_words=4 in all modes; the modes differ only in how many
# words the keys share, i.e. how much lexical information separates them.
nkc_disjoint:      # positive control: keys share no words
  task: niah
  args: {type_haystack: essay, type_needle_k: words, type_needle_v: numbers,
         num_needle_k: 4, num_needle_v: 1, num_needle_q: 1, key_mode: disjoint, key_words: 4}

nkc_shared:        # keys share 3 of 4 words (== key_shared: 3, the default -1)
  task: niah
  args: {type_haystack: essay, type_needle_k: words, type_needle_v: numbers,
         num_needle_k: 4, num_needle_v: 1, num_needle_q: 1, key_mode: shared, key_words: 4}

nkc_shared1:       # keys share 1 of 4 words
  task: niah
  args: {type_haystack: essay, type_needle_k: words, type_needle_v: numbers,
         num_needle_k: 4, num_needle_v: 1, num_needle_q: 1, key_mode: shared, key_words: 4,
         key_shared: 1}

nkc_shared2:       # keys share 2 of 4 words
  task: niah
  args: {type_haystack: essay, type_needle_k: words, type_needle_v: numbers,
         num_needle_k: 4, num_needle_v: 1, num_needle_q: 1, key_mode: shared, key_words: 4,
         key_shared: 2}

